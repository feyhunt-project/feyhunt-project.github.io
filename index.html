<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Best / Worst Vote</title>
<style>
:root{
  --bg:#0b0c0f; --surface:#14161b; --line:rgba(255,255,255,.12); --ink:#f2f3f5; --muted:#7d828c;
  --green:#9bd17b; --red:#ff6b6b;
  --w:calc(128*var(--u));            /* portrait size */
  --shift:calc(70*var(--u));         /* slide distance */
  --ease:cubic-bezier(.22,1.2,.36,1);
  /* UI scale: 2.25px per unit at 1440p (change the 2.25 to resize everything); follows the viewport; mobile resets it to 1px */
  --u:max(.7px,calc(min(100vw / 2560, 100vh / 1440) * 2.25));
  --bg-opacity:.1;      /* background slideshow opacity: 0 (hidden) to 1 (full) */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html{background:radial-gradient(calc(900*var(--u)) calc(500*var(--u)) at 50% 0,#171a22 0,var(--bg) 70%) no-repeat var(--bg)}
main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(20*var(--u));padding:max(calc(24*var(--u)),env(safe-area-inset-top)) calc(16*var(--u)) max(calc(24*var(--u)),env(safe-area-inset-bottom))}

.head{display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u));text-align:center}
h1{margin:0;font-size:calc(20*var(--u));font-weight:600;letter-spacing:.02em}
.hint{margin:0;font-size:calc(14*var(--u));color:var(--muted);text-align:center;letter-spacing:.01em}
.row{display:flex;gap:calc(30*var(--u));justify-content:center}

.bg{position:fixed;inset:0;z-index:0;opacity:var(--bg-opacity);overflow:hidden;pointer-events:none}
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.12);filter:blur(calc(16*var(--u)));
  transition:opacity 1.8s ease,transform 7s ease-out,filter 1.8s ease}
.bg-layer.on{opacity:1;transform:scale(1);filter:blur(0)}

/* ---------- column / slide ---------- */
.col{width:var(--w);height:calc(var(--w) + calc(230*var(--u)));display:flex;align-items:center;justify-content:center}
.stack{display:flex;flex-direction:column;align-items:center;gap:calc(14*var(--u));transition:transform .55s var(--ease)}
.col.best  .stack{transform:translateY(calc(var(--shift) * -1))}
.col.worst .stack{transform:translateY(var(--shift))}

/* ---------- arrows ---------- */
.arrow{width:calc(46*var(--u));height:calc(46*var(--u));border-radius:50%;border:calc(1*var(--u)) solid var(--line);background:rgba(255,255,255,.03);color:var(--c);display:grid;place-items:center;padding:0;cursor:pointer;
  transition:box-shadow .25s,background .25s,border-color .25s,transform .2s,opacity .3s}
.arrow.up{--c:var(--green)} .arrow.down{--c:var(--red)}
.arrow svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.arrow:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 calc(18*var(--u)) color-mix(in srgb,var(--c) 45%,transparent)}
.arrow:active{transform:scale(.9)}
.col.best .arrow.up,.col.worst .arrow.down{opacity:0;pointer-events:none}

/* ---------- card + glow border ---------- */
.card{width:var(--w);text-align:center}
.portrait{position:relative;display:block;width:var(--w);height:var(--w);padding:0;border-radius:calc(18*var(--u));overflow:hidden;cursor:pointer;background:var(--surface);color:var(--ink);
  border:calc(2*var(--u)) solid var(--line);transition:border-color .35s,box-shadow .45s,transform .3s;display:grid;place-items:center;font-size:calc(34*var(--u));font-weight:600}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .4s}
.portrait:hover{border-color:rgba(255,255,255,.4);box-shadow:0 0 calc(22*var(--u)) rgba(255,255,255,.12)}
.col.best  .portrait{border-color:var(--green);box-shadow:0 0 0 calc(1*var(--u)) var(--green),0 0 calc(28*var(--u)) calc(2*var(--u)) rgba(155,209,123,.55),0 0 calc(70*var(--u)) rgba(155,209,123,.25);animation:pulseG 2.6s ease-in-out infinite}
.col.worst .portrait{border-color:var(--red);box-shadow:0 0 0 calc(1*var(--u)) var(--red),0 0 calc(28*var(--u)) calc(2*var(--u)) rgba(255,107,107,.55),0 0 calc(70*var(--u)) rgba(255,107,107,.25);animation:pulseR 2.6s ease-in-out infinite}
@keyframes pulseG{50%{box-shadow:0 0 0 calc(1*var(--u)) var(--green),0 0 calc(36*var(--u)) calc(4*var(--u)) rgba(155,209,123,.7),0 0 calc(90*var(--u)) rgba(155,209,123,.32)}}
@keyframes pulseR{50%{box-shadow:0 0 0 calc(1*var(--u)) var(--red),0 0 calc(36*var(--u)) calc(4*var(--u)) rgba(255,107,107,.7),0 0 calc(90*var(--u)) rgba(255,107,107,.32)}}
/* colored layer BEHIND the image, so transparent PNGs show green / red */
.portrait{isolation:isolate}
.portrait::before,.portrait::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .45s}
.portrait::before{background:radial-gradient(circle at 50% 35%,#c9edb3,var(--green))}
.portrait::after{background:radial-gradient(circle at 50% 35%,#ffa3a3,var(--red))}
.portrait span{position:relative;transition:color .45s}
.col.best .portrait::before{opacity:1}
.col.worst .portrait::after{opacity:1}
.col.best .portrait span,.col.worst .portrait span{color:#0b0c0f}

/* glowing BEST / WORST words in the title */
.tag-best,.tag-worst{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag-best{color:var(--green);text-shadow:0 0 calc(8*var(--u)) rgba(155,209,123,.9),0 0 calc(22*var(--u)) rgba(155,209,123,.6),0 0 calc(44*var(--u)) rgba(155,209,123,.35)}
.tag-worst{color:var(--red);text-shadow:0 0 calc(8*var(--u)) rgba(255,107,107,.9),0 0 calc(22*var(--u)) rgba(255,107,107,.6),0 0 calc(44*var(--u)) rgba(255,107,107,.35)}
.name{margin-top:calc(10*var(--u));font-size:calc(14*var(--u));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.col.best .name{color:var(--green)} .col.worst .name{color:var(--red)}
.arrow:focus-visible,.portrait:focus-visible,#submit:focus-visible{outline:calc(2*var(--u)) solid var(--ink);outline-offset:calc(3*var(--u))}

/* ---------- round enter / exit ---------- */
.col{opacity:0;transform:translateY(calc(14*var(--u)));animation:enter .6s var(--ease) forwards;animation-delay:calc(var(--i) * 70ms)}
@keyframes enter{to{opacity:1;transform:none}}
.row.leaving .col{animation:leave .3s ease forwards;animation-delay:0s}
@keyframes leave{from{opacity:1;transform:none}to{opacity:0;transform:translateY(calc(-10*var(--u)))}}

/* ---------- submit ---------- */
#submit{width:min(100%,calc(var(--w) * 3 + calc(60*var(--u))));height:calc(54*var(--u));border-radius:calc(999*var(--u));border:calc(1*var(--u)) solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;font-size:calc(16*var(--u));font-weight:500;letter-spacing:.02em;cursor:not-allowed;
  transition:background .35s,color .35s,box-shadow .45s,border-color .35s,transform .15s}
#submit:not(:disabled){cursor:pointer;background:var(--ink);color:#0b0c0f;border-color:var(--ink);box-shadow:0 0 calc(34*var(--u)) rgba(255,255,255,.22)}
#submit:not(:disabled):hover{box-shadow:0 0 calc(48*var(--u)) rgba(255,255,255,.35)}
#submit:not(:disabled):active{transform:scale(.98)}
#status{position:fixed;left:0;right:0;bottom:calc(28*var(--u));text-align:center;pointer-events:none;font-size:calc(14*var(--u));color:var(--green);opacity:0;transition:opacity .3s}
#status.show{opacity:1}

/* ---------- mobile: vertical list, best (left) <-> worst (right) ---------- */
@media (max-width:700px){
  :root{--u:1px;--w:68px;--shift:30px}
  main{gap:14px;justify-content:center}
  .row{flex-direction:column;gap:12px;width:100%;align-items:center}
  .col{width:100%;height:auto}
  .stack{flex-direction:row;gap:8px}
  .col.best  .stack{transform:translateX(calc(var(--shift) * -1))}
  .col.worst .stack{transform:translateX(var(--shift))}
  .arrow{width:40px;height:40px;flex:none}
  .arrow svg{transform:rotate(-90deg)}            /* up chevron -> left, down chevron -> right */
  .card{display:flex;align-items:center;gap:12px;width:calc(100vw - 190px);max-width:260px;text-align:left}
  .portrait{flex:none;border-radius:14px;font-size:22px}
  .name{margin:0;font-size:15px;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
  .col.best .name{color:var(--green)} .col.worst .name{color:var(--red)}
  #submit{width:100%;max-width:420px;margin-top:22px}
  h1{font-size:17px}
  #submit{font-size:13.33px}
  .hint{font-size:13px;margin-bottom:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .col{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-layer"></div><div class="bg-layer"></div></div>
<main>
  <header class="head">
    <h1 id="title"></h1>
    <p class="hint">Choose the <b class="tag-best">BEST</b> and <b class="tag-worst">WORST</b> among these characters!</p>
  </header>
  <div class="row" id="row"></div>
  <button id="submit" disabled>Submit (Spacebar)</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
const PAGE_TITLE = "Stella Sora Favorite Character Voting!";   // change the page title here
const MAX_ROUND_SIZE = 5;
const SUBMIT_COOLDOWN_MS = 1000;   // design note: max 1 submit / sec
const CHARACTERS_URL = "data/characters.json";   // source of truth for characters
const BACKGROUNDS_URL = "data/backgrounds.json"; // source of truth for backgrounds

let characters=[], backgrounds=[], best=null, worst=null, locked=false, cols={};
let bgIndex=-1, bgFront=-1;
const $row=document.getElementById("row"), $submit=document.getElementById("submit"),
      $status=document.getElementById("status"), $hint=document.querySelector(".hint"),
      layers=[...document.querySelectorAll(".bg-layer")];

document.title=PAGE_TITLE;
document.getElementById("title").textContent=PAGE_TITLE;
const CHEV_UP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const CHEV_DN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const esc=s=>String(s).replace(/[<>&"]/g,"");

async function getJSON(url){
  const r=await fetch(url,{cache:"no-cache"});
  if(!r.ok) throw new Error(url+" "+r.status);
  return r.json();
}

async function load(){
  // start both requests at once instead of one after the other
  const bgReq=getJSON(BACKGROUNDS_URL)
    .then(d=>(d.backgrounds||[]).filter(b=>b&&b.image))
    .catch(e=>{ console.warn("No backgrounds loaded",e); return []; });
  try{
    const d=await getJSON(CHARACTERS_URL);
    characters=(d.characters||[]).filter(c=>c&&c.id&&c.name);
    if(characters.length<2) throw new Error("Need at least 2 characters");
  }catch(e){
    console.error(e);
    $hint.textContent="Could not load data/characters.json. If you opened the file directly, serve the folder instead (python3 -m http.server).";
    return;
  }
  backgrounds=await bgReq;
  // first background and first round appear together (waits for the image, but at most 1.5 s)
  await Promise.race([changeBackground(), new Promise(r=>setTimeout(r,1500))]);
  nextRound();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- background slideshow ---------- */
function preload(url){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=url})}
let bgQueued=-1;
function pickBg(){
  if(!backgrounds.length) return -1;
  if(backgrounds.length===1) return 0;
  let n; do{ n=Math.random()*backgrounds.length|0; }while(n===bgIndex);
  return n;
}
async function changeBackground(){
  if(!backgrounds.length||(backgrounds.length===1&&bgIndex===0)) return;
  const n=bgQueued>=0?bgQueued:pickBg(); bgQueued=-1;
  const url=encodeURI(backgrounds[n].image);
  if(!await preload(url)) return;                 // skip broken images
  bgIndex=n;
  const next=layers[bgFront===0?1:0], prev=layers[bgFront===0?0:1];
  next.style.backgroundImage=`url("${url}")`;
  void next.offsetWidth;                          // reflow so the transition runs
  next.classList.add("on");
  if(bgFront>=0) prev.classList.remove("on");
  bgFront=bgFront===0?1:0;
  // download the next one in the background so the swap on Submit is instant
  const q=pickBg();
  if(q>=0&&q!==bgIndex){ bgQueued=q; preload(encodeURI(backgrounds[q].image)); }
}

/* ---------- round ---------- */
function nextRound(){
  best=worst=null; cols={};
  $row.classList.remove("leaving"); $row.innerHTML="";
  const size=Math.min(MAX_ROUND_SIZE,characters.length);
  shuffle(characters).slice(0,size).forEach((c,i)=>{
    const col=document.createElement("div");
    col.className="col"; col.style.setProperty("--i",i);
    const name=esc(c.name);
    col.innerHTML=`
      <div class="stack">
        <button class="arrow up" aria-label="Mark ${name} as best">${CHEV_UP}</button>
        <div class="card">
          <button class="portrait" aria-label="${name}: clear pick"><img alt="" src="${encodeURI(c.portrait||"")}"></button>
          <div class="name">${name}</div>
        </div>
        <button class="arrow down" aria-label="Mark ${name} as worst">${CHEV_DN}</button>
      </div>`;
    const img=col.querySelector("img");
    img.onerror=()=>{ img.remove(); const s=document.createElement("span"); s.textContent=c.name.split(" ").map(w=>w[0]).join("").slice(0,2); col.querySelector(".portrait").append(s); };
    col.querySelector(".up").onclick=()=>pick(c.id,"best");
    col.querySelector(".down").onclick=()=>pick(c.id,"worst");
    col.querySelector(".portrait").onclick=()=>clear(c.id);
    cols[c.id]=col; $row.appendChild(col);
  });
  update();
}

function pick(id,kind){
  if(locked) return;
  if(kind==="best"){ best=id; if(worst===id) worst=null; }
  else { worst=id; if(best===id) best=null; }
  update();
}
function clear(id){ if(locked) return; if(best===id) best=null; if(worst===id) worst=null; update(); }

// Update classes in place (not re-rendering) so the CSS transitions can animate the slide.
function update(){
  for(const [id,col] of Object.entries(cols)){
    col.classList.toggle("best",id===best);
    col.classList.toggle("worst",id===worst);
  }
  $submit.disabled=!(best&&worst)||locked;
}

async function submit(){
  if(!best||!worst||locked) return;     // both picks required; also blocks double submit
  locked=true; $submit.disabled=true;
  const payload={best,worst,shown:Object.keys(cols),ts:Date.now()};
  // MOCK: replace with fetch(YOUR_WORKER_URL,{method:"POST",body:JSON.stringify({...payload,turnstileToken})})
  console.log("vote submitted",payload);
  $status.textContent="Vote recorded"; $status.classList.add("show");
  changeBackground();                   // shuffle background on submit
  await new Promise(r=>setTimeout(r,SUBMIT_COOLDOWN_MS-300));
  $row.classList.add("leaving");
  await new Promise(r=>setTimeout(r,300));
  locked=false; $status.classList.remove("show"); nextRound();
}

$submit.addEventListener("click",submit);
document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!e.repeat){ e.preventDefault(); submit(); }
});
load();
</script>
</body>
</html>
