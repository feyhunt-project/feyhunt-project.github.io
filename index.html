<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Currently Active Voting</title>
<style>
:root{
  --bg:#0b0c0f; --line:rgba(255,255,255,.12); --ink:#f2f3f5; --green:#9bd17b;
  --ease:cubic-bezier(.22,1.2,.36,1);
  --bg-opacity:.1;      /* background image opacity: 0 (hidden) to 1 (full) */
  --bg-image:url("bg.jpg");   /* background image at the site root */
  /* UI scale: 2.25px per unit at 1440p; follows the viewport; mobile resets it to 1px */
  --u:max(.7px,calc(min(100vw / 2560, 100vh / 1440) * 2.25));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html{background:radial-gradient(calc(900*var(--u)) calc(500*var(--u)) at 50% 0,#171a22 0,var(--bg) 70%) no-repeat var(--bg)}

.bg{position:fixed;inset:0;z-index:0;opacity:0;overflow:hidden;pointer-events:none;animation:bgIn 2s ease .1s forwards}
.bg::before{content:"";position:absolute;inset:0;background:var(--bg-image) center/cover no-repeat;transform:scale(1.12);filter:blur(16px);animation:bgSettle 7s ease-out forwards}
@keyframes bgIn{to{opacity:var(--bg-opacity)}}
@keyframes bgSettle{to{transform:scale(1);filter:blur(0)}}

main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(44*var(--u));padding:max(calc(24*var(--u)),env(safe-area-inset-top)) 16px max(calc(24*var(--u)),env(safe-area-inset-bottom));text-align:center}
h1{margin:0;font-size:calc(52*var(--u));font-weight:600;letter-spacing:.01em;line-height:1.15}

.btn{--c:var(--green);display:inline-flex;align-items:center;justify-content:center;height:calc(58*var(--u));padding:0 calc(40*var(--u));border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--c);font-size:calc(20*var(--u));font-weight:500;letter-spacing:.03em;text-decoration:none;
  transition:box-shadow .25s,background .25s,border-color .25s,transform .2s}
.btn:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 calc(18*var(--u)) color-mix(in srgb,var(--c) 45%,transparent)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

h1,.btn{opacity:0;transform:translateY(calc(14*var(--u)));animation:enter .7s var(--ease) forwards}
.btn{animation-delay:.12s}
@keyframes enter{to{opacity:1;transform:none}}

@media (max-width:700px){
  :root{--u:1px}
  main{gap:32px}
  h1{font-size:34px}
  .btn{height:52px;padding:0 28px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,.bg::before{animation:none!important;transition-duration:.01ms!important}
  h1,.btn{opacity:1;transform:none}
  .bg{opacity:var(--bg-opacity)}
  .bg::before{transform:none;filter:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <h1>Currently active voting</h1>
  <a class="btn" href="stella-sora/">Stella Sora Best Character</a>
</main>
</body>
</html>
