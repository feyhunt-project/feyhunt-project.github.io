<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tier Sort</title>
<style>
:root{
  --bg:#0b0c0f; --surface:#14161b; --line:rgba(255,255,255,.12); --ink:#f2f3f5; --muted:#7d828c;
  --green:#9bd17b; --red:#ff6b6b;
  --w:calc(120*var(--u));            /* portrait size */
  --shift:calc(65*var(--u));         /* slide distance */
  --ease:cubic-bezier(.22,1.2,.36,1);
  /* UI scale: 2.25px per unit at 1440p (change the 2.25 to resize everything); follows the viewport; mobile resets it to 1px */
  --u:max(.7px,calc(min(100vw / 2560, 100vh / 1440) * 2.25));
  --bg-opacity:.1;      /* background slideshow opacity: 0 (hidden) to 1 (full) */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html{background:radial-gradient(calc(900*var(--u)) calc(500*var(--u)) at 50% 0,#171a22 0,var(--bg) 70%) no-repeat var(--bg)}
main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(14*var(--u));padding:max(calc(16*var(--u)),env(safe-area-inset-top)) calc(16*var(--u)) max(calc(16*var(--u)),env(safe-area-inset-bottom))}

.head{display:flex;flex-direction:column;align-items:center;gap:calc(6*var(--u));text-align:center}
h1{margin:0;font-size:calc(20*var(--u));font-weight:600;letter-spacing:.02em}
.period{margin:0;font-size:calc(12*var(--u));color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:calc(14*var(--u));color:var(--muted);text-align:center;letter-spacing:.01em}
.row{display:flex;gap:calc(28*var(--u));justify-content:center}

.bg{position:fixed;inset:0;z-index:0;opacity:var(--bg-opacity);overflow:hidden;pointer-events:none}
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.12);filter:blur(calc(16*var(--u)));
  transition:opacity 1.8s ease,transform 7s ease-out,filter 1.8s ease}
.bg-layer.on{opacity:1;transform:scale(1);filter:blur(0)}

/* ---------- column / slide ---------- */
.col{width:var(--w);height:calc(var(--w) + calc(179*var(--u)));display:flex;align-items:center;justify-content:center}
.stack{display:flex;flex-direction:column;align-items:center;gap:calc(13*var(--u));transition:transform .55s var(--ease)}
.col.best  .stack{transform:translateY(calc(var(--shift) * -1))}
.col.worst .stack{transform:translateY(var(--shift))}

/* ---------- arrows ---------- */
.arrow{width:calc(43*var(--u));height:calc(43*var(--u));border-radius:50%;border:calc(1*var(--u)) solid var(--line);background:rgba(255,255,255,.03);color:var(--c);display:grid;place-items:center;padding:0;cursor:pointer;
  transition:box-shadow .25s,background .25s,border-color .25s,transform .2s,opacity .3s}
.arrow.up{--c:var(--green)} .arrow.down{--c:var(--red)}
.arrow svg{width:calc(20.5*var(--u));height:calc(20.5*var(--u));fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.arrow:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 calc(17*var(--u)) color-mix(in srgb,var(--c) 45%,transparent)}
.arrow:active{transform:scale(.9)}
.col.best .arrow.up,.col.worst .arrow.down{opacity:0;pointer-events:none}

/* ---------- card + glow border ---------- */
.card{width:var(--w);text-align:center}
.portrait{position:relative;display:block;width:var(--w);height:var(--w);padding:0;border-radius:calc(17*var(--u));overflow:hidden;cursor:pointer;background:var(--surface);color:var(--ink);
  border:calc(2*var(--u)) solid var(--line);transition:border-color .35s,box-shadow .45s,transform .3s;display:grid;place-items:center;font-size:calc(32*var(--u));font-weight:600}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .4s}
.portrait:hover{border-color:rgba(255,255,255,.4);box-shadow:0 0 calc(20.5*var(--u)) rgba(255,255,255,.12)}
.col.best  .portrait{border-color:var(--green);box-shadow:0 0 0 calc(1*var(--u)) var(--green),0 0 calc(26*var(--u)) calc(2*var(--u)) rgba(155,209,123,.55),0 0 calc(65*var(--u)) rgba(155,209,123,.25);animation:pulseG 2.6s ease-in-out infinite}
.col.worst .portrait{border-color:var(--red);box-shadow:0 0 0 calc(1*var(--u)) var(--red),0 0 calc(26*var(--u)) calc(2*var(--u)) rgba(255,107,107,.55),0 0 calc(65*var(--u)) rgba(255,107,107,.25);animation:pulseR 2.6s ease-in-out infinite}
@keyframes pulseG{50%{box-shadow:0 0 0 calc(1*var(--u)) var(--green),0 0 calc(34*var(--u)) calc(4*var(--u)) rgba(155,209,123,.7),0 0 calc(84*var(--u)) rgba(155,209,123,.32)}}
@keyframes pulseR{50%{box-shadow:0 0 0 calc(1*var(--u)) var(--red),0 0 calc(34*var(--u)) calc(4*var(--u)) rgba(255,107,107,.7),0 0 calc(84*var(--u)) rgba(255,107,107,.32)}}
/* colored layer BEHIND the image, so transparent PNGs show green / red */
.portrait{isolation:isolate}
.portrait::before,.portrait::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .45s}
.portrait::before{background:radial-gradient(circle at 50% 35%,#c9edb3,var(--green))}
.portrait::after{background:radial-gradient(circle at 50% 35%,#ffa3a3,var(--red))}
.portrait span{position:relative;transition:color .45s}
.col.best .portrait::before{opacity:1}
.col.worst .portrait::after{opacity:1}
.col.best .portrait span,.col.worst .portrait span{color:#0b0c0f}

/* glowing BEST / WORST words in the title */
.tag-best,.tag-worst{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag-best{color:var(--green);text-shadow:0 0 calc(8*var(--u)) rgba(155,209,123,.9),0 0 calc(22*var(--u)) rgba(155,209,123,.6),0 0 calc(44*var(--u)) rgba(155,209,123,.35)}
.tag-worst{color:var(--red);text-shadow:0 0 calc(8*var(--u)) rgba(255,107,107,.9),0 0 calc(22*var(--u)) rgba(255,107,107,.6),0 0 calc(44*var(--u)) rgba(255,107,107,.35)}
.name{margin-top:calc(9*var(--u));font-size:calc(13*var(--u));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.col.best .name{color:var(--green)} .col.worst .name{color:var(--red)}
.arrow:focus-visible,.portrait:focus-visible,#submit:focus-visible{outline:calc(2*var(--u)) solid var(--ink);outline-offset:calc(3*var(--u))}

/* ---------- round enter / exit ---------- */
.col{opacity:0;transform:translateY(calc(14*var(--u)));animation:enter .6s var(--ease) forwards;animation-delay:calc(var(--i) * 70ms)}
@keyframes enter{to{opacity:1;transform:none}}
.row.leaving .col{animation:leave .3s ease forwards;animation-delay:0s}
@keyframes leave{from{opacity:1;transform:none}to{opacity:0;transform:translateY(calc(-10*var(--u)))}}

/* ---------- submit ---------- */
#submit{width:min(100%,calc(333*var(--u)));height:calc(37.5*var(--u));border-radius:calc(999*var(--u));border:calc(1*var(--u)) solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;font-size:calc(12*var(--u));font-weight:500;letter-spacing:.02em;cursor:not-allowed;
  transition:background .35s,color .35s,box-shadow .45s,border-color .35s,transform .15s}
#submit:not(:disabled){cursor:pointer;background:var(--ink);color:#0b0c0f;border-color:var(--ink);box-shadow:0 0 calc(25.5*var(--u)) rgba(255,255,255,.22)}
#submit:not(:disabled):hover{box-shadow:0 0 calc(36*var(--u)) rgba(255,255,255,.35)}
#submit:not(:disabled):active{transform:scale(.98)}
/* after submitting, the button itself confirms ('Vote recorded') for the cooldown */
#submit.done{cursor:default;background:rgba(155,209,123,.14);color:var(--green);border-color:var(--green);box-shadow:0 0 calc(25.5*var(--u)) rgba(155,209,123,.25)}
@media (min-width:701px){
  main{display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;gap:0;row-gap:calc(10*var(--u));
       padding:max(calc(24*var(--u)),env(safe-area-inset-top)) calc(16*var(--u)) max(calc(24*var(--u)),env(safe-area-inset-bottom))}
  .head{grid-row:1;align-self:start}          /* header | cards (fill the gap, centred in it) | Confidence + Submit | Tier Summary */
  .row{grid-row:2;align-self:center}
  .submit-row{grid-row:3;align-self:end}
  .summary{grid-row:4}
}

/* ---------- mobile: vertical list, best (left) <-> worst (right) ---------- */
@media (max-width:700px){
  :root{--u:1px;--w:68px;--shift:30px}
  main{gap:10px;justify-content:center;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .row{flex-direction:column;gap:10px;width:100%;align-items:center}
  .col{width:100%;height:auto}
  .stack{flex-direction:row;gap:8px}
  .col.best  .stack{transform:translateX(calc(var(--shift) * -1))}
  .col.worst .stack{transform:translateX(var(--shift))}
  .arrow{width:40px;height:40px;flex:none}
  .arrow svg{transform:rotate(-90deg)}            /* up chevron -> left, down chevron -> right */
  .card{display:flex;align-items:center;gap:12px;width:calc(100vw - 190px);max-width:260px;text-align:left}
  .portrait{flex:none;border-radius:14px;font-size:22px}
  .name{margin:0;font-size:15px;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
  .col.best .name{color:var(--green)} .col.worst .name{color:var(--red)}
  /* extra breathing room: title block -> portraits, portraits -> Confidence/Submit (100px, shrinks a little on short screens so it still fits) */
  .head{margin-bottom:min(100px,13vh);margin-bottom:min(100px,13dvh)}
  .row{margin-bottom:min(100px,13vh);margin-bottom:min(100px,13dvh)}
  #submit{width:100%;max-width:394px;margin-top:0;height:45px;font-size:13px}
  h1{font-size:17px}
  .period{font-size:11px}
  .hint{font-size:13px;margin-bottom:6px}
}

/* ================= TIER SORT ================= */
.btn:focus-visible,.linkbtn:focus-visible{outline:calc(2*var(--u)) solid var(--ink);outline-offset:calc(3*var(--u))}
.summary{display:flex;flex-direction:column;align-items:center;gap:calc(6*var(--u));width:min(100%,calc(560*var(--u)))}
.summary[hidden]{display:none}
.summary-body{display:flex;flex-direction:column;align-items:center;gap:calc(16*var(--u));padding:calc(8*var(--u)) 0 calc(4*var(--u))}
.verify:empty{display:none}
.verify{margin:0;font-size:calc(11.5*var(--u));color:var(--muted);text-align:center}

.meter{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u));margin-bottom:calc(6*var(--u))}
.meter[hidden]{display:none}
.bar{position:relative;width:min(100%,calc(333*var(--u)));height:calc(5*var(--u));border-radius:calc(999*var(--u));background:rgba(255,255,255,.08)}
.bar-fill{height:100%;border-radius:inherit;background:var(--ink);opacity:.8;transition:width .4s}
.bar-tick{position:absolute;top:calc(-3*var(--u));bottom:calc(-3*var(--u));width:calc(1*var(--u));background:rgba(255,255,255,.4)}
.meter-sub{white-space:pre-line;line-height:1.5;font-size:calc(11.5*var(--u));color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

.tier-actions{display:flex;flex-wrap:wrap;gap:calc(8*var(--u));justify-content:center}
.btn{height:calc(31*var(--u));padding:0 calc(16*var(--u));border-radius:calc(999*var(--u));border:calc(1*var(--u)) solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-family:inherit;font-size:calc(11.5*var(--u));cursor:pointer;transition:background .25s,border-color .25s,opacity .25s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.btn:disabled{opacity:.35;cursor:default}
.linkbtn{display:inline-flex;align-items:center;gap:calc(4.5*var(--u));padding:calc(3*var(--u)) calc(10.5*var(--u));border:0;border-radius:calc(999*var(--u));background:none;color:var(--muted);font-family:inherit;font-size:calc(11.5*var(--u));cursor:pointer;transition:color .25s,background .25s}
.linkbtn:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.linkbtn svg{width:calc(10.5*var(--u));height:calc(10.5*var(--u));fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.linkbtn[aria-expanded="true"] svg{transform:rotate(180deg)}

.tiers-panel{display:grid;grid-template-rows:0fr;width:100%;transition:grid-template-rows .3s ease}
.tiers-panel.open{grid-template-rows:1fr}
.tiers-inner{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .3s}
.tiers-panel.open .tiers-inner{visibility:visible;transition-delay:0s}
.tier-row{display:flex;gap:calc(12*var(--u));align-items:flex-start;padding:calc(9*var(--u)) 0;border-top:calc(1*var(--u)) solid var(--line)}
.tier-letter{flex:none;width:calc(30*var(--u));font-size:calc(22*var(--u));font-weight:700;text-align:center;color:var(--tc);text-shadow:0 0 calc(10*var(--u)) color-mix(in srgb,var(--tc) 55%,transparent)}
.tier-chips{display:flex;flex-wrap:wrap;gap:calc(6*var(--u));min-height:calc(40*var(--u))}
.tier-empty{align-self:center;font-size:calc(11.5*var(--u));color:var(--muted)}
.chip{width:calc(52*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(3*var(--u))}
.chip-img{position:relative;display:grid;place-items:center;width:calc(40*var(--u));height:calc(40*var(--u));border-radius:calc(11*var(--u));overflow:hidden;background:var(--surface);border:calc(1.5*var(--u)) solid var(--line);font-size:calc(13*var(--u));font-weight:600}
.chip-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chip.shaky{opacity:.7}
.chip.shaky .chip-img{border-style:dashed;border-color:rgba(255,255,255,.45)}
.chip-name{max-width:100%;font-size:calc(8.5*var(--u));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.submit-row{display:flex;align-items:center;justify-content:center;gap:calc(14*var(--u));width:min(100%,calc(400*var(--u)))}
.submit-row #submit{flex:1 1 0;width:auto;min-width:0}
.conf-wheel{flex:none;display:flex;align-items:center;gap:calc(8*var(--u))}
.conf-wheel[hidden]{display:none}
.conf-wheel-label{font-size:calc(11.5*var(--u));color:var(--muted);letter-spacing:.02em}
.donut{width:calc(46*var(--u));height:calc(46*var(--u))}
.donut-track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4}
.donut-fill{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease),stroke .4s}
.donut text{fill:var(--ink);font-family:inherit;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.conf-wheel[data-level="red"] .donut-fill{stroke:var(--red)}
.conf-wheel[data-level="yellow"] .donut-fill{stroke:#f2c94c}
.conf-wheel[data-level="green"] .donut-fill{stroke:var(--green)}
.state-line{font-size:calc(12.5*var(--u));color:var(--muted);text-align:center}
.state-line b{color:var(--ink);font-weight:600}
.stats{display:grid;gap:calc(5*var(--u));margin:0;width:min(100%,calc(320*var(--u)))}
.stats>div{display:flex;justify-content:space-between;gap:calc(12*var(--u));font-size:calc(12*var(--u))}
.stats dt{color:var(--muted)}
.stats dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.stats dd small{color:var(--muted);font-size:inherit}
.stat-note{margin:0;font-size:calc(10.5*var(--u));color:var(--muted);text-align:center;line-height:1.5}
/* nerd stats: per-character numbers next to each portrait */
#tiers-list{width:100%}
#tiers-list.nerd{max-height:min(62vh,calc(560*var(--u)));overflow-y:auto;padding-right:calc(4*var(--u));scrollbar-width:thin}
.nerd-head,.nerd .chip{display:grid;grid-template-columns:calc(26*var(--u)) minmax(0,1fr) calc(46*var(--u)) calc(36*var(--u)) calc(44*var(--u)) calc(28*var(--u));align-items:center;column-gap:calc(8*var(--u))}
.nerd-head{position:sticky;top:0;z-index:1;padding:calc(5*var(--u)) 0 calc(5*var(--u)) calc(42*var(--u));font-size:calc(9.5*var(--u));letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:rgba(11,12,15,.88);backdrop-filter:blur(calc(6*var(--u)))}
.nerd-head span:nth-child(n+3){text-align:right}
.nerd .tier-chips{flex-direction:column;flex-wrap:nowrap;gap:calc(4*var(--u));width:100%;min-width:0}
.nerd .tier-row{align-items:flex-start}
.nerd .chip{width:100%;opacity:1}
.nerd .chip-img{width:calc(26*var(--u));height:calc(26*var(--u));border-radius:calc(8*var(--u));font-size:calc(10*var(--u))}
.nerd .chip-name{font-size:calc(11.5*var(--u));color:var(--ink);text-align:left}
.nv{font-size:calc(11*var(--u));text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.nv.dim{color:var(--muted)}
.nv.b1{color:#f2c94c}
.nv.b2{color:var(--red)}
.tier-legend{margin:calc(6*var(--u)) 0 calc(8*var(--u));font-size:calc(11*var(--u));color:var(--muted);text-align:center}
@media (max-width:700px){
  .summary{width:100%}
  .submit-row{width:100%;max-width:394px}
  .conf-wheel-label{font-size:12px}
  .donut{width:44px;height:44px}
  .nerd-head,.nerd .chip{grid-template-columns:24px minmax(0,1fr) 40px 30px 38px 24px;column-gap:6px}
  .btn{height:36px;font-size:13px}
  .linkbtn{font-size:13px}
  .tier-letter{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .col{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-layer"></div><div class="bg-layer"></div></div>
<main>
  <header class="head">
    <p class="period">05/13 12:00 AM to 06/30 11:59 PM (UTC)</p>
    <h1 id="title"></h1>
    <p class="hint" id="hint">Which character do you like the <b class="tag-best">MOST</b> and <b class="tag-worst">LEAST</b>?</p>
  </header>
  <div class="row" id="trow"></div>
  <div class="submit-row">
    <div class="conf-wheel" id="conf-wheel" data-level="red" title="Confidence = share of characters whose 95% interval (mu ± 2 sigma) crosses at most one tier boundary, i.e. their tier is at worst one step off">
      <span class="conf-wheel-label">Confidence</span>
      <svg class="donut" viewBox="0 0 44 44" role="img" aria-label="Confidence">
        <circle class="donut-track" cx="22" cy="22" r="18"/>
        <circle class="donut-fill" id="donut-fill" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" style="stroke-dasharray:113.1;stroke-dashoffset:113.1"/>
        <text id="donut-text" x="22" y="22" text-anchor="middle" dominant-baseline="central">0%</text>
      </svg>
    </div>
    <button id="submit" disabled>Submit</button>
  </div>
  <section class="summary" id="summary" aria-label="Tier summary">
    <div class="meter" id="meter">
      <div class="meter-sub" id="meter-sub"></div>
      <div class="bar" aria-hidden="true"><div class="bar-fill" id="bar-fill" style="width:0"></div></div>
    </div>
    <button type="button" class="linkbtn" id="tiers-toggle" aria-expanded="false" aria-controls="tiers-panel">
      <span id="tiers-toggle-label">Show Tier Summary</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="tiers-panel" id="tiers-panel">
      <div class="tiers-inner">
        <div class="summary-body">
          <div class="state-line">Current State: <b id="state-main">Volatile</b> · <span id="state-sub">Keep voting</span></div>
          <p class="verify" id="verify" aria-live="polite"></p>
          <dl class="stats">
            <div title="Characters whose 95% interval sits entirely inside one tier"><dt>Exact-tier stability</dt><dd id="stat-exact">0%</dd></div>
            <div title="Characters whose 95% interval crosses at most one tier boundary (tier is at worst one step off). This drives the Confidence wheel"><dt>Boundary stability</dt><dd id="stat-boundary">0%</dd></div>
          </dl>
          <p class="stat-note" id="update-note"></p>
          <button type="button" class="linkbtn" id="nerd-toggle" aria-pressed="false">Show Nerd Stats</button>
          <div id="tiers-list"></div>
          <p class="tier-legend" id="tier-legend"></p>
          <div class="tier-actions">
            <button type="button" class="btn" id="t-undo" disabled>Undo</button>
            <button type="button" class="btn" id="t-skip">Skip set</button>
            <button type="button" class="btn" id="t-reset" disabled>Reset</button>
            <button type="button" class="btn" id="t-copy">Copy tier list</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const PAGE_TITLE = "Stella Sora Favorite Character Voting!";   // change the page title here
const SUBMIT_COOLDOWN_MS = 1000;   // design note: max 1 submit / sec
const CHARACTERS_URL = "data/characters.json";   // source of truth for characters
const BACKGROUNDS_URL = "data/backgrounds.json"; // source of truth for backgrounds

let characters=[], backgrounds=[];
let bgIndex=-1, bgFront=-1;
const $submit=document.getElementById("submit"), $hint=document.getElementById("hint"),
      layers=[...document.querySelectorAll(".bg-layer")];

document.title=PAGE_TITLE;
document.getElementById("title").textContent=PAGE_TITLE;
const CHEV_UP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const CHEV_DN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const esc=s=>String(s).replace(/[<>&"]/g,"");

async function getJSON(url){
  const r=await fetch(url,{cache:"no-cache"});
  if(!r.ok) throw new Error(url+" "+r.status);
  return r.json();
}

async function load(){
  // start both requests at once instead of one after the other
  const bgReq=getJSON(BACKGROUNDS_URL)
    .then(d=>(d.backgrounds||[]).filter(b=>b&&b.image))
    .catch(e=>{ console.warn("No backgrounds loaded",e); return []; });
  try{
    const d=await getJSON(CHARACTERS_URL);
    characters=(d.characters||[]).filter(c=>c&&c.id&&c.name);
    if(characters.length<2) throw new Error("Need at least 2 characters");
    initTier();
  }catch(e){
    console.error(e);
    $hint.textContent="Could not load data/characters.json. If you opened the file directly, serve the folder instead (python3 -m http.server).";
    return;
  }
  backgrounds=await bgReq;
  // first background and first set of cards appear together (waits for the image, but at most 1.5 s)
  await Promise.race([changeBackground(), new Promise(r=>setTimeout(r,1500))]);
  tierNext(); renderMeter();
}

/* ---------- background slideshow ---------- */
function preload(url){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=url})}
let bgQueued=-1;
function pickBg(){
  if(!backgrounds.length) return -1;
  if(backgrounds.length===1) return 0;
  let n; do{ n=Math.random()*backgrounds.length|0; }while(n===bgIndex);
  return n;
}
async function changeBackground(){
  if(!backgrounds.length||(backgrounds.length===1&&bgIndex===0)) return;
  const n=bgQueued>=0?bgQueued:pickBg(); bgQueued=-1;
  const url=encodeURI(backgrounds[n].image);
  if(!await preload(url)) return;                 // skip broken images
  bgIndex=n;
  const next=layers[bgFront===0?1:0], prev=layers[bgFront===0?0:1];
  next.style.backgroundImage=`url("${url}")`;
  void next.offsetWidth;                          // reflow so the transition runs
  next.classList.add("on");
  if(bgFront>=0) prev.classList.remove("on");
  bgFront=bgFront===0?1:0;
  // download the next one in the background so the swap on Submit is instant
  const q=pickBg();
  if(q>=0&&q!==bgIndex){ bgQueued=q; preload(encodeURI(backgrounds[q].image)); }
}

/* ===== TIER ENGINE START ===== */
const TS={
  LABELS:["S","A","B","C","D","E","F"],
  PCT:[5,15,25,25,15,10,5],        // % of items per bucket, top to bottom (must sum to 100)
  MU0:1000, SIGMA0:100, SIGMA_MIN:8, SIGMA_CAP:140,
  K:64,                            // base Elo step (scaled by relative uncertainty)
  SHRINK:.80,                      // sigma multiplier after an expected result
  SURPRISE_P:.35,                  // a win with expected probability below this counts as an upset
  SPIKE:.9,                        // how hard an upset inflates sigma
  EPS:10, DISPLAY_EVERY:3, PRIOR_TAU:200, MLE_ITERS:60,   // re-fit + next-set pick run after EVERY vote; only the on-screen numbers refresh every DISPLAY_EVERY votes
  LIGHT_YELLOW:40, LIGHT_GREEN:95,      // traffic-light thresholds (% of characters whose 95% interval straddles at most one tier boundary)
  BUDGET_PER_CHAR:1.2                   // suggested votes = 1.2 x roster size
};
function tsHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967296}
const tsKey=(a,b)=>a<b?a+"\u0001"+b:b+"\u0001"+a;
const tsClamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
function tsNew(ids){
  const items=ids.map(id=>({id,mu:TS.MU0,sigma:TS.SIGMA0,n:0,spike:1,tb:tsHash(String(id))}));
  return{items,byId:new Map(items.map(i=>[i.id,i])),games:[],pairs:new Map(),skips:new Map()};
}
/* online update: Elo-style step weighted by relative uncertainty, sigma shrinks, upsets spike sigma */
function tsOnline(S,w,l){
  const A=S.byId.get(w),B=S.byId.get(l);
  const E=1/(1+Math.pow(10,(B.mu-A.mu)/400));
  const vA=A.sigma*A.sigma,vB=B.sigma*B.sigma,tot=vA+vB;
  A.mu+=TS.K*2*(vA/tot)*(1-E);
  B.mu-=TS.K*2*(vB/tot)*(1-E);
  const surprise=E<TS.SURPRISE_P?(TS.SURPRISE_P-E)/TS.SURPRISE_P:0;
  for(const it of[A,B]){
    if(surprise>0){ const f=1+TS.SPIKE*surprise; it.sigma*=f; it.spike=Math.min(2.5,it.spike*f); }
    else{ it.sigma*=TS.SHRINK; it.spike=1+(it.spike-1)*.6; }
    it.sigma=tsClamp(it.sigma,TS.SIGMA_MIN,TS.SIGMA_CAP);
    it.n++;
  }
}
/* retrospective recalibration: MAP Bradley-Terry over ALL past comparisons (Gauss-Seidel, diagonal Newton) */
function tsRecalibrate(S){
  const lam=Math.LN10/400,tau2=TS.PRIOR_TAU*TS.PRIOR_TAU,idx=new Map(S.items.map((it,i)=>[it.id,i]));
  const adj=S.items.map(()=>[]);
  for(const[w,l]of S.games){const a=idx.get(w),b=idx.get(l);adj[a].push([b,1]);adj[b].push([a,0]);}
  const mu=S.items.map(it=>it.mu);
  for(let k=0;k<TS.MLE_ITERS;k++){
    let move=0;
    for(let i=0;i<mu.length;i++){
      if(!adj[i].length)continue;
      let g=-(mu[i]-TS.MU0)/tau2,h=1/tau2;
      for(const[j,won]of adj[i]){const p=1/(1+Math.exp(-lam*(mu[i]-mu[j])));g+=lam*(won-p);h+=lam*lam*p*(1-p);}
      const d=tsClamp(g/h,-150,150);mu[i]+=d;move=Math.max(move,Math.abs(d));
    }
    if(move<.01)break;
  }
  S.items.forEach((it,i)=>{if(adj[i].length)it.mu=mu[i];});
}
function tsRecord(S,w,l){
  S.games.push([w,l]);
  const k=tsKey(w,l);S.pairs.set(k,(S.pairs.get(k)||0)+1);
  tsOnline(S,w,l);               // cheap online update only; the retrospective recalibration runs once per batch of votes (see tsReplay / UI)
}
/* state is a pure function of the vote history, so undo / reload = replay. A vote = a list of [winner,loser] pairs.
   After EVERY vote the whole history is re-fitted (recalibration, ~1-14 ms) so the next set is always chosen from fresh ratings.
   What the user SEES (S.snap: tiers, confidence, per-character stats) only refreshes every TS.DISPLAY_EVERY votes, so the number
   doesn't wobble after every single pick (simulation: ~5 visible confidence drops per 36-vote session if shown every vote, <1 every 3rd vote). */
function tsAfterVote(S,nVotes){tsRecalibrate(S);if(nVotes%TS.DISPLAY_EVERY===0)S.snap=tsBuckets(S);}
function tsReplay(ids,votes){
  const S=tsNew(ids),ok=new Set(ids);let n=0;
  S.snap=tsBuckets(S);
  for(const v of votes){
    for(const[w,l]of v)if(ok.has(w)&&ok.has(l)&&w!==l)tsRecord(S,w,l);
    tsAfterVote(S,++n);
  }
  return S;
}
/* active sampler: pair score = (si^2+sj^2)/(|mi-mj|+eps); jitter = random tie-break (no list-order bias);
   already-compared / skipped pairs are discounted. A "set" is the best-scoring pair plus the third item that scores
   best against both, so one 3-card vote re-tests the most ambiguous neighbourhood. */
function tsPairScore(S,a,b){
  const k=tsKey(a.id,b.id);
  let s=(a.sigma*a.sigma+b.sigma*b.sigma)/(Math.abs(a.mu-b.mu)+TS.EPS);
  s/=1+3*(S.pairs.get(k)||0)+20*(S.skips.get(k)||0);
  return s*(.9+.2*Math.random());
}
function tsSelectSet(S,size,exclude){
  const it=S.items;size=Math.min(size,it.length);
  const skip=i=>exclude&&exclude.has(it[i].id);
  let best=null,bs=-1;
  for(let i=0;i<it.length;i++){if(skip(i))continue;for(let j=i+1;j<it.length;j++){if(skip(j))continue;const s=tsPairScore(S,it[i],it[j]);if(s>bs){bs=s;best=[i,j];}}}
  if(!best)return[];
  const set=[best[0],best[1]];
  if(size>=3){
    let k3=-1,s3=-1;
    for(let k=0;k<it.length;k++){
      if(k===best[0]||k===best[1]||skip(k))continue;
      const s=tsPairScore(S,it[best[0]],it[k])+tsPairScore(S,it[best[1]],it[k]);
      if(s>s3){s3=s;k3=k;}
    }
    if(k3>=0)set.push(k3);
  }
  for(let i=set.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[set[i],set[j]]=[set[j],set[i]];}   // random on-screen order
  return set.map(i=>it[i].id);
}
/* Suggested budget in VOTES for a roster of N: 1.2 votes per character (simulation: ~95-99% of characters within one tier, ~52-63% exact tier;
   accuracy depends on votes per character, not on roster size). Rounded up to a display refresh because the numbers only update every TS.DISPLAY_EVERY votes. */
function tsBudget(N){return Math.max(TS.DISPLAY_EVERY,Math.ceil(N*TS.BUDGET_PER_CHAR/TS.DISPLAY_EVERY)*TS.DISPLAY_EVERY);}
/* bucket assignment by rank percentile + boundary stability */
function tsBuckets(S){
  const N=S.items.length,order=S.items.slice().sort((a,b)=>b.mu-a.mu||a.tb-b.tb);
  const cuts=[];let cum=0;for(let k=0;k<TS.PCT.length-1;k++){cum+=TS.PCT[k]/100;cuts.push(Math.round(N*cum));}
  const bounds=cuts.map(c=>c>0&&c<N?(order[c-1].mu+order[c].mu)/2:null).filter(x=>x!==null);
  const tiers=TS.LABELS.map(()=>[]),of=new Map();
  order.forEach((it,r)=>{let b=0;while(b<cuts.length&&r>=cuts[b])b++;tiers[b].push(it);of.set(it.id,b);});
  /* Boundary stability from the 95% interval mu +/- 2 sigma:
     strict  = interval sits entirely inside one tier (crosses 0 boundaries)  -> "exact-tier stability", also drives the dashed chips
     relaxed = interval crosses at most 1 boundary (tier is at worst one step off) -> System Confidence shown by the Confidence donut */
  const wl=new Map();for(const[w,l]of S.games){(wl.get(w)||wl.set(w,[0,0]).get(w))[0]++;(wl.get(l)||wl.set(l,[0,0]).get(l))[1]++;}
  let strict=0,relaxed=0;const stableSet=new Set(),info=new Map();   // info = frozen per-character numbers for the "nerd stats" view
  for(const it of S.items){
    const lo=it.mu-2*it.sigma,hi=it.mu+2*it.sigma;
    const crossed=bounds.filter(b=>b>lo&&b<hi).length,rec=wl.get(it.id)||[0,0];
    if(crossed===0){strict++;stableSet.add(it.id);}
    if(crossed<=1)relaxed++;
    info.set(it.id,{mu:it.mu,sigma:it.sigma,crossed,w:rec[0],l:rec[1],spike:it.spike});
  }
  return{order,tiers,of,bounds,stableSet,info,strict,relaxed,confidence:N?relaxed/N*100:0,strictConfidence:N?strict/N*100:0};
}
/* ===== TIER ENGINE END ===== */

/* ============================================================
   TIER SORT  (Active Bayesian Bucket Classifier)
   Pairwise comparisons -> Bayesian ratings (mu, sigma) -> 7 quantile buckets.
   Tune everything in the TS object above (bucket %, step size, shrink rate, batch size ...).
   ============================================================ */
const TIER_STORE="stellasora.tiersort.v2", TIER_STORE_V1="stellasora.tiersort.v1";   // localStorage keys; only the vote history is stored (v1 = old flat list of pairs)
const TIER_COLORS=["#ff8f6b","#ffb86b","#ffe16b","#c8e86b","#7fd9a1","#6bc2ff","#a98bff"];
const $trow=document.getElementById("trow"), $updateNote=document.getElementById("update-note"), $wheel=document.getElementById("conf-wheel"), $donutFill=document.getElementById("donut-fill"), $donutText=document.getElementById("donut-text"),
      $stateMain=document.getElementById("state-main"), $stateSub=document.getElementById("state-sub"), $statExact=document.getElementById("stat-exact"), $statBoundary=document.getElementById("stat-boundary"), $nerd=document.getElementById("nerd-toggle"),
      $verify=document.getElementById("verify"),
      $barFill=document.getElementById("bar-fill"),
      $meterSub=document.getElementById("meter-sub"), $undo=document.getElementById("t-undo"), $skip=document.getElementById("t-skip"),
      $reset=document.getElementById("t-reset"), $copy=document.getElementById("t-copy"), $tiersToggle=document.getElementById("tiers-toggle"),
      $tiersLabel=document.getElementById("tiers-toggle-label"), $tiersPanel=document.getElementById("tiers-panel"), $tiersList=document.getElementById("tiers-list");
let T=null, tB=null, tCur=null, tBest=null, tWorst=null, tCols=new Map(), tLocked=false, tiersOpen=false, nerdOn=false, charById=new Map();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function tierLoadVotes(){
  try{
    const v2=JSON.parse(localStorage.getItem(TIER_STORE)||"null");
    if(Array.isArray(v2)) return v2.filter(v=>Array.isArray(v)&&v.every(g=>Array.isArray(g)&&g.length===2));
    const v1=JSON.parse(localStorage.getItem(TIER_STORE_V1)||"[]"), out=[];   // migrate: old data was flat, 3 pairs per vote
    if(Array.isArray(v1)) for(let i=0;i<v1.length;i+=3) out.push(v1.slice(i,i+3).filter(g=>Array.isArray(g)&&g.length===2));
    return out.filter(v=>v.length);
  }catch(e){ return []; }
}
function tierSave(){ try{ localStorage.setItem(TIER_STORE,JSON.stringify(T.votes)); }catch(e){} }
function tierRebuild(votes){            // state is a pure function of the vote history: undo / reset / reload / roster edits all go through here
  const skips=T?T.skips:new Map(), ok=new Set(characters.map(c=>c.id));
  votes=votes.map(v=>v.filter(([w,l])=>ok.has(w)&&ok.has(l)&&w!==l)).filter(v=>v.length);   // drop pairs involving characters no longer in the JSON
  T=tsReplay(characters.map(c=>c.id),votes); T.skips=skips; T.votes=votes;
  tB=T.snap; tCur=null;
}
function initTier(){
  charById=new Map(characters.map(c=>[c.id,c]));
  T=null; tierRebuild(tierLoadVotes());
}

function fillPortrait(el,c){
  const img=document.createElement("img"); img.alt=""; img.src=encodeURI(c.portrait||"");
  img.onerror=()=>{ img.remove(); const s=document.createElement("span"); s.textContent=c.name.split(" ").map(w=>w[0]).join("").slice(0,2); el.append(s); };
  el.append(img);
}

/* ----- one vote = a set of 3 cards; best / middle / worst are stored as 3 ordered pairs (best>middle, middle>worst, best>worst) ----- */
function tierNext(){
  tBest=tWorst=null;
  tCur=tsSelectSet(T,3);            // active sampler on freshly re-fitted ratings: the most ambiguous neighbourhood right now
  renderTrio();
}
function renderTrio(){
  $trow.classList.remove("leaving"); $trow.innerHTML=""; tCols=new Map();
  (tCur||[]).forEach((id,i)=>{
    const c=charById.get(id), name=esc(c.name), col=document.createElement("div");
    col.className="col"; col.style.setProperty("--i",i);
    col.innerHTML=`
      <div class="stack">
        <button class="arrow up" aria-label="Mark ${name} as best">${CHEV_UP}</button>
        <div class="card">
          <button class="portrait" aria-label="${name}: clear pick"></button>
          <div class="name">${name}</div>
        </div>
        <button class="arrow down" aria-label="Mark ${name} as worst">${CHEV_DN}</button>
      </div>`;
    fillPortrait(col.querySelector(".portrait"),c);
    col.querySelector(".up").onclick=()=>tierMark(id,"best");
    col.querySelector(".down").onclick=()=>tierMark(id,"worst");
    col.querySelector(".portrait").onclick=()=>tierMark(id,"clear");
    tCols.set(id,col); $trow.appendChild(col);
  });
  tierSync();
  // fault tolerance made visible: an upset inflates sigma, so the sampler re-checks that character against close peers
  $verify.textContent=(tCur||[]).some(id=>T.byId.get(id).spike>1.25)?"Re-verifying a surprising result":"";
}
function tierMark(id,kind){
  if(tLocked) return;
  if(kind==="best"){ tBest=id; if(tWorst===id) tWorst=null; }
  else if(kind==="worst"){ tWorst=id; if(tBest===id) tBest=null; }
  else { if(tBest===id) tBest=null; if(tWorst===id) tWorst=null; }
  tierSync();
}
function tierSync(){
  for(const [id,col] of tCols){ col.classList.toggle("best",id===tBest); col.classList.toggle("worst",id===tWorst); }
  $submit.disabled=tBest===null||tWorst===null||tLocked;     
}
async function tierSubmit(){
  if(tLocked||tBest===null||tWorst===null) return; tLocked=true; $submit.disabled=true;
  const mid=tCur.find(id=>id!==tBest&&id!==tWorst);
  const matchups=mid===undefined?[[tBest,tWorst]]:[[tBest,mid],[mid,tWorst],[tBest,tWorst]];   // [winner, loser]
  matchups.forEach(([w,l])=>tsRecord(T,w,l)); T.votes.push(matchups); tierSave();   // cheap online rating update happens per matchup; the full re-fit + display refresh only per batch
  const payload={best:tBest,middle:mid,worst:tWorst,shown:tCur,ts:Date.now()};
  // MOCK: replace with fetch(YOUR_WORKER_URL,{method:"POST",body:JSON.stringify({...payload,turnstileToken})})
  console.log("tier vote recorded",payload);
  const shown=T.snap; tsAfterVote(T,T.votes.length);   // re-fit now; the on-screen numbers only change every TS.DISPLAY_EVERY votes
  if(T.snap!==shown){ tB=T.snap; if(tiersOpen) renderTiers(); }
  renderMeter();
  $submit.textContent="Vote recorded"; $submit.classList.add("done");      // confirmation shown on the button itself
  changeBackground();                                  // shuffle background on submit
  await sleep(SUBMIT_COOLDOWN_MS-300);
  $trow.classList.add("leaving"); await sleep(300);
  $submit.classList.remove("done"); $submit.textContent="Submit"; tLocked=false; tierNext();
}
function tierSkip(){
  if(tLocked||!tCur) return;
  for(let i=0;i<tCur.length;i++)for(let j=i+1;j<tCur.length;j++){ const k=tsKey(tCur[i],tCur[j]); T.skips.set(k,(T.skips.get(k)||0)+1); }
  tierNext();                 // re-pick with the skipped pairs discounted
}
function tierUndo(){            // removes the last vote
  if(tLocked||!T.votes.length) return;
  tierRebuild(T.votes.slice(0,-1)); tierSave(); tierNext(); renderMeter(); if(tiersOpen) renderTiers();
}
function tierReset(){
  if(tLocked||!T.votes.length) return;
  if(!confirm("Clear all "+T.votes.length+" votes and start over?")) return;
  T.skips=new Map(); tierRebuild([]); tierSave(); tierNext(); renderMeter(); if(tiersOpen) renderTiers();
}

/* ----- confidence indicator (updates at each batch boundary) ----- */
function renderMeter(){
  const N=characters.length, votes=T.votes.length, pct=tB.confidence, B=TS.DISPLAY_EVERY;
  const budget=tsBudget(N);                           // suggested votes = 1.2 x roster size (from the JSON)
  const level=pct>=TS.LIGHT_GREEN?"green":pct>=TS.LIGHT_YELLOW?"yellow":"red";
  $wheel.dataset.level=level;
  // Confidence donut (left of Submit)
  $donutFill.style.strokeDashoffset=(113.1*(1-Math.min(100,pct)/100)).toFixed(2);
  $donutText.textContent=Math.round(pct)+"%";
  $wheel.setAttribute("aria-label","Confidence "+Math.round(pct)+" percent");
  // suggested votes + progress bar
  $barFill.style.width=Math.min(100,votes/budget*100)+"%";
  $meterSub.textContent=votes+" / ~"+budget+" suggested votes for "+N+" characters"
    +(votes>budget&&level!=="green"?" · past the suggestion, more votes still help":"");
  // Tier Summary
  const [m,sub]=level==="green"?["Converged","Tiers within ±1"]:level==="yellow"?["Stabilizing","Boundaries resolving"]:["Volatile","Keep voting"];
  $stateMain.textContent=m; $stateSub.textContent=sub;
  $statExact.innerHTML=Math.round(tB.strictConfidence)+"% <small>("+tB.strict+" / "+N+")</small>";
  $statBoundary.innerHTML=Math.round(pct)+"% <small>("+tB.relaxed+" / "+N+")</small>";
  const left=B-votes%B;
  $updateNote.textContent="Donut: yellow ≥ "+TS.LIGHT_YELLOW+"%, green ≥ "+TS.LIGHT_GREEN+"% boundary stability. Updates every "+B+" votes"+(left===B?"":" · next in "+left);
  $undo.disabled=!votes; $reset.disabled=!votes;
}

/* ----- tier list (+ nerd stats) ----- */
function renderTiers(){
  $tiersList.innerHTML=""; $tiersList.classList.toggle("nerd",nerdOn);
  document.getElementById("tier-legend").textContent=nerdOn
    ? "μ rating · σ uncertainty · W–L wins–losses · Bnd = tier boundaries inside μ ± 2σ (0 = exact tier, 1 = at worst ±1). Refreshed every "+TS.DISPLAY_EVERY+" votes"
    : "Dashed = close to a tier boundary, still being resolved · refreshed every "+TS.DISPLAY_EVERY+" votes";
  if(nerdOn){
    const h=document.createElement("div"); h.className="nerd-head";
    ["","Character","μ","σ","W–L","Bnd"].forEach(t=>{ const x=document.createElement("span"); x.textContent=t; h.append(x); });
    $tiersList.append(h);
  }
  tB.tiers.forEach((items,b)=>{
    const row=document.createElement("div"); row.className="tier-row"; row.style.setProperty("--tc",TIER_COLORS[b]);
    const L=document.createElement("div"); L.className="tier-letter"; L.textContent=TS.LABELS[b];
    const chips=document.createElement("div"); chips.className="tier-chips";
    if(!items.length){ const e=document.createElement("span"); e.className="tier-empty"; e.textContent="—"; chips.append(e); }
    items.forEach(it=>{
      const c=charById.get(it.id), chip=document.createElement("div");
      chip.className="chip"+(!nerdOn&&!tB.stableSet.has(it.id)?" shaky":""); chip.title=c.name;
      const im=document.createElement("div"); im.className="chip-img"; fillPortrait(im,c);
      const nm=document.createElement("div"); nm.className="chip-name"; nm.textContent=c.name;
      chip.append(im,nm);
      if(nerdOn){
        const i=tB.info.get(it.id), add=(t,cls)=>{ const x=document.createElement("span"); x.className="nv"+(cls?" "+cls:""); x.textContent=t; chip.append(x); };
        add(Math.round(i.mu)); add(i.sigma.toFixed(0),"dim"); add(i.w+"–"+i.l,"dim");
        add(i.crossed===0?"·":String(i.crossed),i.crossed===1?"b1":i.crossed>1?"b2":"dim");
      }
      chips.append(chip);
    });
    row.append(L,chips); $tiersList.append(row);
  });
}
function setTiersOpen(open){
  tiersOpen=open; $tiersPanel.classList.toggle("open",open);
  $tiersToggle.setAttribute("aria-expanded",open);
  $tiersLabel.textContent=open?"Hide Tier Summary":"Show Tier Summary";
  if(open) renderTiers();
}
function setNerd(on){
  nerdOn=on; $nerd.setAttribute("aria-pressed",on); $nerd.textContent=on?"Hide Nerd Stats":"Show Nerd Stats";
  renderTiers();
}
async function tierCopy(){
  const text=tB.tiers.map((items,b)=>TS.LABELS[b]+": "+items.map(i=>charById.get(i.id).name).join(", ")).join("\n");
  let ok=false; try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){}
  $copy.textContent=ok?"Copied ✓":"Copy failed";
  setTimeout(()=>{ $copy.textContent="Copy tier list"; },1600);
}

$undo.onclick=tierUndo; $skip.onclick=tierSkip; $reset.onclick=tierReset; $copy.onclick=tierCopy;
$tiersToggle.onclick=()=>setTiersOpen(!tiersOpen); $nerd.onclick=()=>setNerd(!nerdOn);
$submit.addEventListener("click",tierSubmit);
document.addEventListener("keydown",e=>{               // Space = submit, Ctrl/Cmd+Z = undo last vote
  if(e.repeat||(e.target.closest&&e.target.closest(".summary button"))) return;   // let the Tier Summary buttons behave normally
  if(e.code==="Space"){ e.preventDefault(); tierSubmit(); }
  else if(e.code==="KeyZ"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); tierUndo(); }
});
load();
</script>
</body>
